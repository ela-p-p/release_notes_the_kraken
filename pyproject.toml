[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "release-notes-the-kraken"
version = "0.1.0"
description = "MCP server for JIRA release notes generation"
requires-python = ">=3.14"
dependencies = [
    "mcp>=1.0.0",
    "anthropic>=0.18.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/release_notes_the_kraken"]


# Ruff configuration
[tool.ruff]
line-length = 90
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"